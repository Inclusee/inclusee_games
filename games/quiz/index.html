<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz - Inclusee Games</title>
<meta name="description" content="A friendly quiz from Inclusee. Written by staff, no timers, nothing lost.">
<meta name="theme-color" content="#002C40">
<meta name="robots" content="noindex">
<link rel="icon" href="../../assets/inclusee-logo.png">
<link rel="stylesheet" href="../shared/inclusee-theme.css">
<link rel="stylesheet" href="css/quiz.css">
</head>
<body>

<header class="app-bar">
  <img class="logo" src="../../assets/inclusee-logo.png" alt="Inclusee - Connecting Community">
  <span class="app-name">Games</span>
  <span class="spacer"></span>
  <a href="../index.html">All games</a>
  <a href="https://app.inclusee.org">Back to Inclusee</a>
</header>

<div class="page">
  <div class="game-head">
    <h1 id="puzzle-title">Quiz</h1>
    <p class="date-line" id="puzzle-date"></p>
  </div>

  <p id="loading" class="panel">Fetching today's quiz&hellip;</p>
  <div id="error" class="panel" role="alert" hidden></div>
  <p class="visually-hidden" id="live" role="status" aria-live="polite"></p>

  <section class="panel profile-panel" aria-labelledby="profile-heading">
    <h2 id="profile-heading" class="profile-heading">Your name</h2>
    <div class="profile-row">
      <input type="text" id="who" name="who" maxlength="24" autocomplete="name"
             spellcheck="false" placeholder="Type your name, then press Save"
             aria-describedby="streak">
      <button type="button" id="who-save">Save</button>
    </div>
    <p id="streak" class="streak-line" role="status" aria-live="polite"></p>
    <div id="streak-days" class="streak-days" aria-hidden="true"></div>
  </section>

  <div class="layout" id="game" hidden>
    <section class="panel quiz-panel">
      <h2 class="visually-hidden">Question</h2>
      <p class="question-word" id="progress">Question 1</p>
      <p id="question" class="question-text" aria-live="polite"></p>

      <div id="choices" class="choices" role="group" aria-label="Answers"></div>

      <p id="feedback" class="note" hidden></p>
      <div class="controls">
        <button type="button" id="next" hidden style="min-height:3rem">Next question</button>
      </div>

      <div class="progress-bar" aria-hidden="true"><div class="filled" id="progress-fill" style="width:0%"></div></div>

      <p id="status" role="status"></p>

      <div id="end-panel" hidden>
        <h2 id="end-head"></h2>
        <p id="end-message"></p>
      </div>

      <div class="display-options">
        <button type="button" id="again" class="secondary" hidden>Play again</button>
        <button type="button" id="bigger" class="secondary" aria-pressed="false">Bigger text</button>
        <button type="button" id="dark" class="secondary" aria-pressed="false">Dark screen</button>
        <button type="button" id="print" class="plain">Print</button>
      </div>
    </section>
  </div>

  <div id="staff-notes" hidden></div>
</div>

<script src="../config.js"></script>
<script src="../shared/dates.js"></script>
<script src="../shared/save-state.js"></script>
<script src="../shared/profile.js"></script>
<script src="../shared/seeded-random.js"></script>
<script src="../shared/player-panel.js"></script>
<script src="../crossword/js/content-loader.js"></script>
<script src="js/quiz-list.js"></script>
<script src="js/quiz-maker.js"></script>
<script src="js/quiz.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', function () {
    var check = setInterval(function () {
      if (window.IncluseeQuizGame && window.IncluseeQuizGame.state() && window.IncluseeQuizGame.state().puzzle) {
        clearInterval(check);
      }
    }, 100);
  });
</script>
</body>
</html>
